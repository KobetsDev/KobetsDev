<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="214" viewBox="0 0 1200 214" role="img" aria-labelledby="title"><title id="title">Let’s build it. Telegram @Ya_Kobets or kobets.dev@gmail.com.</title><defs><linearGradient id="accent"><stop stop-color="#5ce1e6"/><stop offset=".55" stop-color="#a99bff"/><stop offset="1" stop-color="#f391c6"/></linearGradient><radialGradient id="glow"><stop stop-color="#6d44bd" stop-opacity=".26"/><stop offset="1" stop-color="#6d44bd" stop-opacity="0"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8aa2db" stroke-opacity=".05"/></pattern><clipPath id="bounds"><rect width="1200" height="214" rx="22"/></clipPath><clipPath id="typing"><rect class="type" width="610" height="44"/></clipPath></defs><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 22s linear infinite}.float{animation:float 5s ease-in-out infinite}.pulse{animation:pulse 3s ease-in-out infinite}.scan{stroke-dasharray:14 900;animation:scan 7s linear infinite}.cursor{animation:blink 1s steps(2,end) infinite}.type{animation:type 10s steps(32,end) infinite}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes float{50%{transform:translateY(-10px)}}@keyframes pulse{50%{opacity:.35}}@keyframes scan{to{stroke-dashoffset:-1828}}@keyframes blink{50%{opacity:0}}@keyframes type{0%,6%{width:0}42%,82%{width:610px}95%,100%{width:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.type{width:610px}}</style><g clip-path="url(#bounds)"><rect x="0" y="0" width="1200" height="214" rx="22" fill="#0b1020" /><rect width="1200" height="214" fill="url(#grid)"/><ellipse cx="610" cy="230" rx="550" ry="310" fill="url(#glow)"/><text x="600" y="56" fill="#5ce1e6" font-size="15" font-weight="700" class="mono" text-anchor="middle" letter-spacing="3">HAVE SOMETHING INTERESTING IN MIND?</text><text x="600" y="113" fill="#ecf2ff" font-size="49" font-weight="700" text-anchor="middle" letter-spacing="-2">Let&#x27;s build it.</text><text x="600" y="155" fill="#99a9ca" font-size="18" font-weight="400" class="mono" text-anchor="middle">@Ya_Kobets / kobets.dev@gmail.com</text><path d="M210 191H990" stroke="url(#accent)" stroke-width="2" class="pulse"/></g><rect x=".5" y=".5" width="1199" height="213" rx="22" fill="none" stroke="#293656"/></svg>