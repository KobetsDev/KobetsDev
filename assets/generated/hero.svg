<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="478" viewBox="0 0 1200 478" role="img" aria-labelledby="title"><title id="title">Alexander Kobets — frontend developer. React, TypeScript and Python. Animated developer terminal.</title><defs><linearGradient id="accent"><stop stop-color="#5ce1e6"/><stop offset=".55" stop-color="#a99bff"/><stop offset="1" stop-color="#f391c6"/></linearGradient><radialGradient id="glow"><stop stop-color="#6d44bd" stop-opacity=".26"/><stop offset="1" stop-color="#6d44bd" stop-opacity="0"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8aa2db" stroke-opacity=".05"/></pattern><clipPath id="bounds"><rect width="1200" height="478" rx="22"/></clipPath><clipPath id="typing"><rect class="type" width="610" height="44"/></clipPath></defs><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 22s linear infinite}.float{animation:float 5s ease-in-out infinite}.pulse{animation:pulse 3s ease-in-out infinite}.scan{stroke-dasharray:14 900;animation:scan 7s linear infinite}.cursor{animation:blink 1s steps(2,end) infinite}.type{animation:type 10s steps(32,end) infinite}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes float{50%{transform:translateY(-10px)}}@keyframes pulse{50%{opacity:.35}}@keyframes scan{to{stroke-dashoffset:-1828}}@keyframes blink{50%{opacity:0}}@keyframes type{0%,6%{width:0}42%,82%{width:610px}95%,100%{width:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.type{width:610px}}</style><g clip-path="url(#bounds)"><rect x="0" y="0" width="1200" height="478" rx="22" fill="#0b1020" /><rect width="1200" height="478" fill="url(#grid)"/><ellipse cx="920" cy="160" rx="420" ry="370" fill="url(#glow)"/><text x="46" y="48" fill="#5ce1e6" font-size="18" font-weight="700" class="mono" letter-spacing="3">K / DEV</text><text x="1154" y="48" fill="#99a9ca" font-size="14" font-weight="400" class="mono" text-anchor="end">REACT · TYPESCRIPT · PYTHON</text><path d="M46 68H1154" stroke="#293656"/><path class="scan" d="M46 68H1154" stroke="url(#accent)" stroke-width="2"/><text x="45" y="153" fill="#ecf2ff" font-size="82" font-weight="700" letter-spacing="-4">Alexander</text><text x="45" y="239" fill="url(#accent)" font-size="82" font-weight="700" letter-spacing="-4">Kobets</text><text x="48" y="284" fill="#5ce1e6" font-size="21" font-weight="700" class="mono" letter-spacing="3">FRONTEND DEVELOPER</text><g transform="translate(48 310)"><g clip-path="url(#typing)"><text x="0" y="28" fill="#ecf2ff" font-size="22" font-weight="400" class="mono">&gt; turning ideas into interfaces_</text></g></g><text x="48" y="378" fill="#99a9ca" font-size="18" font-weight="400" >React interfaces. Python tools. Curious by default.</text><g class="float"><rect x="714" y="109" width="435" height="284" rx="16" fill="#0d1528" stroke="#3c3b68"/><circle cx="739" cy="131" r="4.5" fill="#f391c6"/><circle cx="758" cy="131" r="4.5" fill="#f5cc8d"/><circle cx="777" cy="131" r="4.5" fill="#5ce1e6"/><text x="1124" y="136" fill="#99a9ca" font-size="14" font-weight="400" class="mono" text-anchor="end">alex@dev:~</text><path d="M714 153H1149" stroke="#293656"/><text x="738" y="182" fill="#5ce1e6" font-size="16" font-weight="400" class="mono">$ whoami</text><text x="738" y="207" fill="#ecf2ff" font-size="16" font-weight="400" class="mono">frontend developer</text><text x="738" y="232" fill="#a99bff" font-size="16" font-weight="400" class="mono">$ cat interests.json</text><text x="738" y="257" fill="#99a9ca" font-size="16" font-weight="400" class="mono">{</text><text x="738" y="282" fill="#ecf2ff" font-size="16" font-weight="400" class="mono">  &quot;web&quot;: &quot;React + TypeScript&quot;,</text><text x="738" y="307" fill="#ecf2ff" font-size="16" font-weight="400" class="mono">  &quot;tools&quot;: &quot;Python + Telegram&quot;</text><text x="738" y="332" fill="#99a9ca" font-size="16" font-weight="400" class="mono">}</text><text x="738" y="372" fill="#5ce1e6" font-size="16" font-weight="400" class="mono">$ </text><rect x="759" y="358" width="9" height="17" rx="0" fill="#5ce1e6" class="cursor"/></g><g transform="translate(646 209)"><g class="orbit" fill="none" stroke="#8581d8" stroke-width="1.2" opacity=".65"><ellipse rx="48" ry="16"/><ellipse rx="48" ry="16" transform="rotate(60)"/><ellipse rx="48" ry="16" transform="rotate(120)"/></g><circle r="5" fill="#5ce1e6" class="pulse"/></g><path d="M46 416H1154" stroke="#293656"/><text x="48" y="450" fill="#5ce1e6" font-size="13" font-weight="700" class="mono" letter-spacing="2">01 / INTERFACES</text><text x="433" y="450" fill="#a99bff" font-size="13" font-weight="700" class="mono" letter-spacing="2">02 / AUTOMATION</text><text x="872" y="450" fill="#f391c6" font-size="13" font-weight="700" class="mono" letter-spacing="2">03 / EXPERIMENTS</text></g><rect x=".5" y=".5" width="1199" height="477" rx="22" fill="none" stroke="#293656"/></svg>