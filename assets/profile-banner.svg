<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Alexander — frontend developer</title>
  <desc id="desc">Interfaces, tools, and ideas made real. A midnight blue banner with mint typography and an abstract interface illustration.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101c2a"/>
      <stop offset="1" stop-color="#080e18"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#213346"/>
      <stop offset="1" stop-color="#142131"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#a5c8e5" stroke-opacity=".045"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="400" rx="20"/></clipPath>
  </defs>
